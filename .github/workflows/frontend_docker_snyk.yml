name: Frontend Docker build + Snyk report

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/**"

permissions:
  contents: read
  security-events: write

jobs:
  docker-build-and-scan-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Build Docker image for frontend
      - name: Docker build frontend image
        run: |
          docker build \
            -t ots2025-frontend:${{ github.sha }} \
            -f frontend/Dockerfile \
            ./frontend

      # 2) Install Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # 3) Auth Snyk
      - name: Snyk auth
        run: snyk auth $SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 4) Snyk container test -> JSON + SARIF (NE ustavi pipeline)
      - name: Snyk container test (generate reports)
        continue-on-error: true
        run: |
          snyk container test ots2025-frontend:${{ github.sha }} \
            --file=frontend/Dockerfile \
            --severity-threshold=high \
            --sarif-file-output=frontend-snyk.sarif \
            --json-file-output=frontend-snyk.json || true

      # 4b) Snyk monitor -> pošlje rezultate v Snyk Dashboard (grafično)
      - name: Snyk monitor (send results to Snyk Dashboard)
        continue-on-error: true
        run: |
          snyk container monitor ots2025-frontend:${{ github.sha }} \
            --file=frontend/Dockerfile \
            --project-name=ots2025-frontend || true

      # 4c) Debug: preveri, da so fajli res nastali
      - name: List snyk outputs (debug)
        if: always()
        run: ls -lah frontend-snyk.* || true

      # 5) Povzetek kot tabela v GitHub Actions Summary
      - name: Create Snyk summary table
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f frontend-snyk.json ]; then
            echo "## Snyk Container Scan Summary (frontend)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_No JSON report generated._" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Snyk Container Scan Summary (frontend)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          sudo apt-get update -y
          sudo apt-get install -y jq

          CRITICAL=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="critical") ] | length' frontend-snyk.json)
          HIGH=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="high") ] | length' frontend-snyk.json)
          MEDIUM=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="medium") ] | length' frontend-snyk.json)
          LOW=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="low") ] | length' frontend-snyk.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top issues (first 5)" >> $GITHUB_STEP_SUMMARY
          jq -r '
            (.vulnerabilities // [])
            | sort_by(.severity)
            | reverse
            | .[0:5]
            | .[]
            | "- **\(.title)** (\(.severity)) in `\(.packageName)`"
          ' frontend-snyk.json >> $GITHUB_STEP_SUMMARY \
          || echo "_No vulnerabilities parsed._" >> $GITHUB_STEP_SUMMARY

      # 6) SARIF GitHub-safe (odstrani securitySeverity + 1 run)
      - name: Make SARIF GitHub-safe
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f frontend-snyk.sarif ]; then
            echo "No SARIF to sanitize."
            exit 0
          fi

          python3 - <<'PY'
          import json

          path = "frontend-snyk.sarif"
          with open(path, "r", encoding="utf-8") as f:
            sarif = json.load(f)

          def drop_security_severity(obj):
            if isinstance(obj, dict):
              obj.pop("securitySeverity", None)
              for v in obj.values():
                drop_security_severity(v)
            elif isinstance(obj, list):
              for item in obj:
                drop_security_severity(item)

          drop_security_severity(sarif)

          if isinstance(sarif.get("runs"), list) and len(sarif["runs"]) > 1:
            sarif["runs"] = [sarif["runs"][0]]

          with open(path, "w", encoding="utf-8") as f:
            json.dump(sarif, f)

          print("Frontend SARIF cleaned for GitHub.")
          PY

      # 7) Upload SARIF -> GitHub Security (če obstaja)
      - name: Upload SARIF to GitHub Security
        if: always()
        continue-on-error: true
        run: |
          if [ -f frontend-snyk.sarif ]; then
            echo "SARIF exists, uploading..."
          else
            echo "No SARIF generated, skipping upload."
            exit 0
          fi
        # dejanski upload kot ločen korak, da if-check dela
      - name: Upload SARIF (action)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: frontend-snyk.sarif
          category: snyk-frontend

      # 8) Artefakti (če obstajajo)
      - name: Upload Snyk reports as artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: snyk-frontend-container-report
          path: |
            frontend-snyk.sarif
            frontend-snyk.json