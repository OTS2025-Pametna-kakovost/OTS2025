name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# skupne pravice za PR dekoracije + SARIF upload
permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

jobs:

  # -------------------------
  # 1) BUILD BACKEND
  # -------------------------
  build_backend:
    name: Build backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: measdb
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '20'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml
        working-directory: backend


  # -------------------------
  # 2) BUILD FRONTEND
  # -------------------------
  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [build_backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build --no-progress 2>&1 >/dev/null || true
        working-directory: frontend


  # -------------------------
  # 3) QODANA
  # -------------------------
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    needs: [build_backend, build_frontend]

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          args: --fail-threshold,2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'


  # -------------------------
  # 4) SONARCLOUD FRONTEND
  # -------------------------
  sonar_frontend:
    name: SonarCloud Frontend
    runs-on: ubuntu-latest
    needs: [build_frontend]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: SonarCloud Scan Frontend
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io


  # -------------------------
  # 5) SONARCLOUD BACKEND
  # -------------------------
  sonar_backend:
    name: SonarCloud Backend
    runs-on: ubuntu-latest
    needs: [build_backend]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '20'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze (Maven + Sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=ots2025_be


  # -------------------------
  # 6) BACKEND DOCKER + SNYK
  # -------------------------
  docker_build_and_scan_backend:
    name: Backend Docker build + Snyk report
    runs-on: ubuntu-latest
    needs: [build_backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend (maven)
        working-directory: backend
        run: ./mvnw -B clean package

      - name: Docker build backend image
        run: |
          docker build \
            -t ots2025-backend:${{ github.sha }} \
            -f backend/src/main/docker/Dockerfile.jvm \
            ./backend

      - name: Snyk container scan (create reports)
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ots2025-backend:${{ github.sha }}
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk.sarif
            --json-file-output=snyk.json

      - name: Snyk monitor (send results to Snyk Dashboard)
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          image: ots2025-backend:${{ github.sha }}
          args: >
            --project-name=ots2025-backend

      - name: Create Snyk summary table
        if: always()
        run: |
          echo "## Snyk Container Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          sudo apt-get update -y
          sudo apt-get install -y jq

          CRITICAL=$(jq '[.vulnerabilities[] | select(.severity=="critical")] | length' snyk.json)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' snyk.json)
          MEDIUM=$(jq '[.vulnerabilities[] | select(.severity=="medium")] | length' snyk.json)
          LOW=$(jq '[.vulnerabilities[] | select(.severity=="low")] | length' snyk.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top issues (first 5)" >> $GITHUB_STEP_SUMMARY
          jq -r '
            .vulnerabilities
            | sort_by(.severity)
            | reverse
            | .[0:5]
            | .[]
            | "- **\(.title)** (\(.severity)) in `\(.packageName)` \n  - Fix: \(.fixedIn[0] // "No fix")"
          ' snyk.json >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Upload Snyk reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-report
          path: |
            snyk.sarif
            snyk.json


  # -------------------------
  # 7) FRONTEND DOCKER + SNYK
  # -------------------------
  docker_build_and_scan_frontend:
    name: Frontend Docker build + Snyk report
    runs-on: ubuntu-latest
    needs: [build_frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build frontend image
        run: |
          docker build \
            -t ots2025-frontend:${{ github.sha }} \
            -f frontend/Dockerfile \
            ./frontend

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk auth
        run: snyk auth $SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk container test (generate reports)
        continue-on-error: true
        run: |
          snyk container test ots2025-frontend:${{ github.sha }} \
            --file=frontend/Dockerfile \
            --severity-threshold=high \
            --sarif-file-output=frontend-snyk.sarif \
            --json-file-output=frontend-snyk.json || true

      - name: Snyk monitor (send results to Snyk Dashboard)
        continue-on-error: true
        run: |
          snyk container monitor ots2025-frontend:${{ github.sha }} \
            --file=frontend/Dockerfile \
            --project-name=ots2025-frontend || true

      - name: List snyk outputs (debug)
        if: always()
        run: ls -lah frontend-snyk.* || true

      - name: Create Snyk summary table
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f frontend-snyk.json ]; then
            echo "## Snyk Container Scan Summary (frontend)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_No JSON report generated._" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Snyk Container Scan Summary (frontend)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          sudo apt-get update -y
          sudo apt-get install -y jq

          CRITICAL=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="critical") ] | length' frontend-snyk.json)
          HIGH=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="high") ] | length' frontend-snyk.json)
          MEDIUM=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="medium") ] | length' frontend-snyk.json)
          LOW=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="low") ] | length' frontend-snyk.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top issues (first 5)" >> $GITHUB_STEP_SUMMARY
          jq -r '
            (.vulnerabilities // [])
            | sort_by(.severity)
            | reverse
            | .[0:5]
            | .[]
            | "- **\(.title)** (\(.severity)) in `\(.packageName)`"
          ' frontend-snyk.json >> $GITHUB_STEP_SUMMARY \
          || echo "_No vulnerabilities parsed._" >> $GITHUB_STEP_SUMMARY

      - name: Make SARIF GitHub-safe
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f frontend-snyk.sarif ]; then
            echo "No SARIF to sanitize."
            exit 0
          fi

          python3 - <<'PY'
          import json

          path = "frontend-snyk.sarif"
          with open(path, "r", encoding="utf-8") as f:
            sarif = json.load(f)

          def drop_security_severity(obj):
            if isinstance(obj, dict):
              obj.pop("securitySeverity", None)
              for v in obj.values():
                drop_security_severity(v)
            elif isinstance(obj, list):
              for item in obj:
                drop_security_severity(item)

          drop_security_severity(sarif)

          if isinstance(sarif.get("runs"), list) and len(sarif["runs"]) > 1:
            sarif["runs"] = [sarif["runs"][0]]

          with open(path, "w", encoding="utf-8") as f:
            json.dump(sarif, f)

          print("Frontend SARIF cleaned for GitHub.")
          PY

      - name: Upload SARIF to GitHub Security (check)
        if: always()
        continue-on-error: true
        run: |
          if [ -f frontend-snyk.sarif ]; then
            echo "SARIF exists, uploading..."
          else
            echo "No SARIF generated, skipping upload."
            exit 0
          fi

      - name: Upload SARIF (action)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: frontend-snyk.sarif
          category: snyk-frontend

      - name: Upload Snyk reports as artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: snyk-frontend-container-report
          path: |
            frontend-snyk.sarif
            frontend-snyk.json