name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Qodana Scan + Quality Gate (Community JVM)
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          args: "--image=jetbrains/qodana-jvm-community:2025.2 --fail-threshold=2"