name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan (JVM) + Quality Gate
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          args: |
            --linter,jetbrains/qodana-jvm:2025.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

  # primer: tvoj ostali CI/CD naj počaka na Qodano
  ci:
    runs-on: ubuntu-latest
    needs: qodana   # <-- če Qodana faila gate, se ta job sploh ne zažene
    steps:
      - uses: actions/checkout@v4
      - name: Build/test/whatever
        run: echo "CI continues only if Qodana gate passed"