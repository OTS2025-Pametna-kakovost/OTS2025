name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Qodana Community linter (NE rabi Qodana Cloud tokena)
      # Quality gate se bere iz qodana.yaml (failureConditions).
      - name: Qodana Scan + Quality Gate (Community)
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          upload-result: true
          args: >
            --image jetbrains/qodana-jvm-community:latest
        # ⚠️ Ne podajaj QODANA_TOKEN, ker community ne dela cloud auth
        # env:
        #   QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        #   QODANA_ENDPOINT: 'https://qodana.cloud'

  ci:
    runs-on: ubuntu-latest
    needs: qodana
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI teče samo, če je Qodana gate PASSED"