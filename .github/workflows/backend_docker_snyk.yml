name: Backend Docker build + Snyk report

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"

permissions:
  contents: read
  security-events: write

jobs:
  docker-build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1) build Quarkus backend
      - name: Build backend (maven)
        working-directory: backend
        run: ./mvnw -B clean package

      # 2) build Docker image
      - name: Docker build backend image
        run: |
          docker build \
            -t ots2025-backend:${{ github.sha }} \
            -f backend/src/main/docker/Dockerfile.jvm \
            ./backend

      # 3) Snyk scan -> SARIF + JSON, NE ustavi pipeline
      - name: Snyk container scan (create reports)
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ots2025-backend:${{ github.sha }}
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk.sarif
            --json-file-output=snyk.json

      # 3b) Snyk monitor -> pošlje rezultate v Snyk Dashboard (grafično)
      - name: Snyk monitor (send results to Snyk Dashboard)
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          image: ots2025-backend:${{ github.sha }}
          args: >
            --project-name=ots2025-backend

      # 3c) Naredi povzetek kot tabelo v GitHub Actions Summary
      - name: Create Snyk summary table
        if: always()
        run: |
          echo "## Snyk Container Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # namesti jq za parsing json
          sudo apt-get update -y
          sudo apt-get install -y jq

          CRITICAL=$(jq '[.vulnerabilities[] | select(.severity=="critical")] | length' snyk.json)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' snyk.json)
          MEDIUM=$(jq '[.vulnerabilities[] | select(.severity=="medium")] | length' snyk.json)
          LOW=$(jq '[.vulnerabilities[] | select(.severity=="low")] | length' snyk.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top issues (first 5)" >> $GITHUB_STEP_SUMMARY
          jq -r '
            .vulnerabilities
            | sort_by(.severity)
            | reverse
            | .[0:5]
            | .[]
            | "- **\(.title)** (\(.severity)) in `\(.packageName)` \n  - Fix: \(.fixedIn[0] // "No fix")"
          ' snyk.json >> $GITHUB_STEP_SUMMARY

      # 4) Upload SARIF -> GitHub Security (Code scanning alerts)
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      # 5) Artefakti
      - name: Upload Snyk reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-report
          path: |
            snyk.sarif
            snyk.json