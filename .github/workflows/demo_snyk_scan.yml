name: DEMO - Snyk scan intentionally vulnerable image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  demo-scan-debian-stretch:
    runs-on: ubuntu-latest

    steps:
      - name: Pull demo image (old Debian)
        run: docker pull debian:stretch

      - name: Snyk container test (generate SARIF + JSON)
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          image: debian:stretch
          args: >
            --severity-threshold=medium
            --sarif
            --sarif-file-output=snyk.sarif
            --json-file-output=snyk.json

      - name: Ensure demo SARIF/JSON exists (rename)
        if: always()
        run: |
          if [ -f snyk.sarif ]; then mv snyk.sarif demo-snyk.sarif; fi
          if [ -f snyk.json ]; then mv snyk.json demo-snyk.json; fi
          ls -lah demo-snyk.*

      # ⭐ TO JE NOVO: tabela v Actions Summary
      - name: Create Snyk DEMO summary table
        if: always()
        run: |
          echo "## Snyk DEMO Scan Summary (debian:stretch)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          sudo apt-get update -y
          sudo apt-get install -y jq

          CRITICAL=$(jq '[.vulnerabilities[] | select(.severity=="critical")] | length' demo-snyk.json)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' demo-snyk.json)
          MEDIUM=$(jq '[.vulnerabilities[] | select(.severity=="medium")] | length' demo-snyk.json)
          LOW=$(jq '[.vulnerabilities[] | select(.severity=="low")] | length' demo-snyk.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top issues (first 5)" >> $GITHUB_STEP_SUMMARY
          jq -r '
            .vulnerabilities
            | sort_by(.severity)
            | reverse
            | .[0:5]
            | .[]
            | "- **\(.title)** (\(.severity)) in `\(.packageName)` \n  - Fix: \(.fixedIn[0] // "No fix")"
          ' demo-snyk.json >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub Security (DEMO)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: demo-snyk.sarif

      - name: Upload DEMO reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-debian-stretch-snyk-report
          path: |
            demo-snyk.sarif
            demo-snyk.json