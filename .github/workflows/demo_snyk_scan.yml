name: DEMO - Snyk scan intentionally vulnerable image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  demo-scan-debian-stretch:
    runs-on: ubuntu-latest

    steps:
      - name: Pull demo image (old Debian)
        run: docker pull debian:stretch

      - name: Snyk container test (generate SARIF + JSON)
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test          # 🔥 KLJUČNO!
          image: debian:stretch
          args: >
            --severity-threshold=medium
            --sarif-file-output=demo-snyk.sarif
            --json-file-output=demo-snyk.json

      - name: List output files (debug)
        if: always()
        run: ls -lah .

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4   # 🔥 posodobljeno
        with:
          sarif_file: demo-snyk.sarif

      - name: Upload DEMO reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-debian-stretch-snyk-report
          path: |
            demo-snyk.sarif
            demo-snyk.json