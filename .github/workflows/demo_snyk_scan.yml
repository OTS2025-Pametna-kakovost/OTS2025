name: DEMO - Snyk container scan vulnerable image (CLI)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  demo-scan-juice-shop:
    runs-on: ubuntu-latest

    steps:
      # ✅ da je git repo za SARIF processing
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull intentionally vulnerable demo image
        run: docker pull bkimminich/juice-shop:latest

      # 1) Install Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # 2) Auth Snyk
      - name: Snyk auth
        run: snyk auth $SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3) Container test -> SARIF + JSON (NE ustavi pipeline)
      - name: Snyk container test (generate SARIF + JSON)
        continue-on-error: true
        run: |
          snyk container test bkimminich/juice-shop:latest \
            --severity-threshold=low \
            --sarif-file-output=demo-snyk.sarif \
            --json-file-output=demo-snyk.json

      # 4) Sanitize SARIF:
      #    - securitySeverity null -> 0.0
      #    - keep only 1 run (GitHub ne sprejme več runs/file)
      - name: Sanitize SARIF for GitHub Code Scanning
        if: always()
        run: |
          python3 - <<'PY'
          import json

          path = "demo-snyk.sarif"
          with open(path, "r", encoding="utf-8") as f:
            sarif = json.load(f)

          # Fix null securitySeverity
          for run in sarif.get("runs", []):
            rules = run.get("tool", {}).get("driver", {}).get("rules", [])
            for r in rules:
              props = r.get("properties", {})
              if props.get("securitySeverity") is None:
                props["securitySeverity"] = 0.0
                r["properties"] = props

          # Reduce SARIF to single run
          if "runs" in sarif and isinstance(sarif["runs"], list) and len(sarif["runs"]) > 1:
            sarif["runs"] = [sarif["runs"][0]]

          with open(path, "w", encoding="utf-8") as f:
            json.dump(sarif, f)

          print("SARIF sanitized + reduced to single run.")
          PY

      # 5) Summary tabela v GitHub Actions
      - name: Create Snyk DEMO summary table
        if: always()
        continue-on-error: true
        run: |
          echo "## Snyk DEMO Scan Summary (OWASP Juice Shop)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          sudo apt-get update -y
          sudo apt-get install -y jq

          CRITICAL=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="critical") ] | length' demo-snyk.json)
          HIGH=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="high") ] | length' demo-snyk.json)
          MEDIUM=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="medium") ] | length' demo-snyk.json)
          LOW=$(jq '[ (.vulnerabilities // [])[] | select(.severity=="low") ] | length' demo-snyk.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top issues (first 5)" >> $GITHUB_STEP_SUMMARY
          jq -r '
            (.vulnerabilities // [])
            | sort_by(.severity)
            | reverse
            | .[0:5]
            | .[]
            | "- **\(.title)** (\(.severity)) in `\(.packageName)`"
          ' demo-snyk.json >> $GITHUB_STEP_SUMMARY \
          || echo "_No vulnerabilities parsed._" >> $GITHUB_STEP_SUMMARY

      # 6) Upload SARIF v GitHub Security (grafični list alertov)
      - name: Upload SARIF to GitHub Security (DEMO)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: demo-snyk.sarif
          category: snyk-demo-juice-shop

      # 7) Artefakti za download
      - name: Upload DEMO reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-juice-shop-snyk-report
          path: |
            demo-snyk.sarif
            demo-snyk.json