name: DEMO - Snyk scan vulnerable image (diagnostic)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  demo-scan-juice-shop:
    runs-on: ubuntu-latest

    steps:
      - name: Pull intentionally vulnerable demo image
        run: docker pull bkimminich/juice-shop:latest

      - name: Snyk container test (generate SARIF + JSON)
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          image: bkimminich/juice-shop:latest
          args: >
            --severity-threshold=low
            --sarif
            --sarif-file-output=snyk.sarif
            --json-file-output=snyk.json

      - name: Rename outputs to demo-*
        if: always()
        run: |
          if [ -f snyk.sarif ]; then mv snyk.sarif demo-snyk.sarif; fi
          if [ -f snyk.json ]; then mv snyk.json demo-snyk.json; fi
          ls -lah demo-snyk.* || true

      - name: Create Snyk DEMO summary (diagnostic + robust counts)
        if: always()
        continue-on-error: true
        run: |
          echo "## Snyk DEMO Scan Summary (OWASP Juice Shop)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          sudo apt-get update -y
          sudo apt-get install -y jq

          echo "### 1) Scan status check" >> $GITHUB_STEP_SUMMARY
          # če je v json error ali ok=false, to izpišemo
          OK_FIELD=$(jq -r '.ok // empty' demo-snyk.json 2>/dev/null || true)
          ERR_FIELD=$(jq -r '.error // empty' demo-snyk.json 2>/dev/null || true)
          MESSAGE_FIELD=$(jq -r '.message // empty' demo-snyk.json 2>/dev/null || true)

          if [ "$OK_FIELD" = "false" ] || [ -n "$ERR_FIELD" ] || [ -n "$MESSAGE_FIELD" ]; then
            echo "- ⚠️ Snyk JSON contains an error or ok=false." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "```json" >> $GITHUB_STEP_SUMMARY
            jq 'del(.vulnerabilities) | .error?, .message?, .ok?' demo-snyk.json >> $GITHUB_STEP_SUMMARY || true
            echo "```" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Scan looks successful (no error fields found)." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 2) Robust vulnerability extraction" >> $GITHUB_STEP_SUMMARY

          # zberemo ranljivosti iz VSEH možnih struktur
          ALL_VULNS=$(jq -c '
            [
              (.vulnerabilities // []),
              (.results // [] | map(.vulnerabilities // []) | add),
              (.runs // [] | map(.results // []) | add)
            ]
            | add
            | flatten
          ' demo-snyk.json 2>/dev/null || echo "[]")

          CRITICAL=$(echo "$ALL_VULNS" | jq '[.[] | select(.severity=="critical")] | length')
          HIGH=$(echo "$ALL_VULNS" | jq '[.[] | select(.severity=="high")] | length')
          MEDIUM=$(echo "$ALL_VULNS" | jq '[.[] | select(.severity=="medium")] | length')
          LOW=$(echo "$ALL_VULNS" | jq '[.[] | select(.severity=="low")] | length')

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 3) Top issues (first 5)" >> $GITHUB_STEP_SUMMARY
          echo "$ALL_VULNS" | jq -r '
            sort_by(.severity) | reverse | .[0:5] | .[]
            | "- **\(.title // .id // "issue")** (\(.severity)) in `\(.packageName // .name // "package")`"
          ' >> $GITHUB_STEP_SUMMARY \
          || echo "_No vulnerabilities parsed._" >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub Security (DEMO)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: demo-snyk.sarif

      - name: Upload DEMO reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-juice-shop-snyk-report
          path: |
            demo-snyk.sarif
            demo-snyk.json